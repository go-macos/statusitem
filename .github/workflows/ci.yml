name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A workflow that fails to PARSE reports nothing at all: no jobs run, no
  # checks appear, and the pull request looks unexercised rather than broken.
  # This is the only lane that would notice.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  gofmt:
    name: gofmt + tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # The real AppKit lane. It runs the LIVE suite, which really puts items in the
  # menu bar of the runner's session and removes them again — nothing is taken
  # away from anybody, unlike a system-wide hot key. If the runner turns out to
  # have no window server, every live test SKIPS rather than failing for the
  # wrong reason, and the portable suite still runs.
  darwin:
    name: darwin (CGO=0, real AppKit)
    runs-on: macos-latest
    # A live AppKit suite that hangs is the worst failure in CI: the job burns
    # its whole budget and reports nothing, which looks like a runner fault. The
    # suite has its own three-minute watchdog; this is the floor under it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: CGO_ENABLED=0 go vet ./...
      - run: CGO_ENABLED=0 go build ./...
      - name: Test (portable + live)
        run: CGO_ENABLED=0 go test -count=1 -v ./...
      - name: Coverage (the library package; the cmd is a tool, not the contract)
        run: CGO_ENABLED=0 go test -count=1 -coverprofile=cover.out .
      - name: Race (CGO=1)
        run: CGO_ENABLED=1 go test -race -count=1 ./...
      # The gate is on the PORTABLE files, not the total. The AppKit bindings
      # cannot be covered without a window server, and this lane's runner may or
      # may not have one — so a total-coverage gate would be a number chosen to
      # pass rather than a standard.
      - name: 100% coverage gate on the portable menu model
        shell: bash
        run: |
          # By SHAPE, not by name. The platform suffixes are Go's OWN
          # vocabulary — the toolchain decides what each one compiles for — so a
          # new portable file is gated the day it is written instead of the day
          # somebody remembers to add it to a list.
          go tool cover -func=cover.out \
            | grep -vE '_(darwin|linux|android|windows|js|other)\.go:' \
            | grep -v '/cmd/' \
            | grep -v '^total:' > portable.txt || true
          cat portable.txt
          if [ ! -s portable.txt ]; then
            echo "::error::no portable files were measured at all; the filter is wrong"; exit 1
          fi
          if grep -v '100\.0%' portable.txt; then
            echo "::error::the portable menu model is below 100% (lines above)"; exit 1
          fi
          echo "portable menu model: 100%"
      - name: Coverage summary (whole package, AppKit bindings included)
        run: go tool cover -func=cover.out | tail -1

  # Every non-darwin platform must COMPILE and answer ErrUnsupported rather than
  # failing to build: a consumer cross-compiles this without thinking about it.
  # All six of Go's 64-bit targets, plus every platform the README makes a claim
  # about.
  cross:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: android, goarch: arm64 }
          - { goos: js, goarch: wasm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...

  # The menu model is OS-independent by construction, so it is RUN, not merely
  # compiled, on all six of Go's 64-bit architectures: amd64 natively, the other
  # five under qemu-user.
  arches:
    name: run tests on ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64, qemu: "", qemu_cpu: "" }
          - { goarch: arm64, qemu: qemu-aarch64-static, qemu_cpu: "" }
          - { goarch: riscv64, qemu: qemu-riscv64-static, qemu_cpu: "" }
          - { goarch: loong64, qemu: qemu-loongarch64-static, qemu_cpu: "" }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static, qemu_cpu: power10 }
          - { goarch: s390x, qemu: qemu-s390x-static, qemu_cpu: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install qemu-user
        if: matrix.qemu != ''
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Build the test binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go test -c -o statusitem.test .
      # QEMU_CPU must be EXPORTED ONLY when it has a value: qemu-user refuses to
      # start with "-cpu option cannot be empty" if it is set to the empty
      # string, which is what `env: QEMU_CPU: ${{ matrix.qemu_cpu }}` does for the
      # arches that do not need one. Setting a variable empty is not the same as
      # not setting it.
      - name: Run it
        env:
          QEMU: ${{ matrix.qemu }}
          QEMU_CPU_WANTED: ${{ matrix.qemu_cpu }}
        run: |
          if [ -n "$QEMU_CPU_WANTED" ]; then
            export QEMU_CPU="$QEMU_CPU_WANTED"
          fi
          if [ -z "$QEMU" ]; then
            ./statusitem.test -test.count=1 -test.v
          else
            "$QEMU" ./statusitem.test -test.count=1 -test.v
          fi

  linux:
    name: linux (stubs + full coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: CGO_ENABLED=0 go test -count=1 ./...
      - run: CGO_ENABLED=0 go test -count=1 -coverprofile=cover.out .
      # Off darwin there is no excuse for anything in the library to be
      # uncovered: all that exists here is the portable menu model plus the
      # stubs, and both are reachable from a test.
      - name: 100% coverage gate on EVERYTHING that exists off darwin
        shell: bash
        run: |
          go tool cover -func=cover.out | tee full.txt
          if grep -v '100\.0%' full.txt | grep -v '^total:'; then
            echo "::error::below 100% on linux (lines above)"; exit 1
          fi

  windows:
    name: windows (stubs)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test -count=1 ./...
        env:
          CGO_ENABLED: 0
